<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Rehobot Studios | Links</title>
    <style>
        /* ===== ESTILO GENERAL (TERROR / RE2) ===== */
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: radial-gradient(circle at top, #0a1a2f, #000814);
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #4db8ff;
            box-shadow: 0 0 40px rgba(77, 184, 255, 0.5);
            border-radius: 12px;
            padding: 40px;
            width: 320px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        

        .subtitle {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 30px;
        }

        /* ===== BOTONES ===== */
        .link {
            display: block;
            text-decoration: none;
            color: white;
            border: 2px solid #4db8ff;
            padding: 14px;
            margin: 12px 0;
            border-radius: 6px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.25s ease;
            background: linear-gradient(90deg, #0a2a4f, #000814);
        }

        .link:hover {
            background: #4db8ff;
            box-shadow: 0 0 15px rgba(77, 184, 255, 0.8);
            transform: scale(1.03);
        }

        /* ===== EFECTO PARPADEO SUAVE ===== */
        @keyframes flicker {
            0% { opacity: 1; }
            45% { opacity: 0.95; }
            50% { opacity: 0.8; }
            55% { opacity: 1; }
            100% { opacity: 0.98; }
        }

        .container {
            animation: flicker 4s infinite;
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>REHOBOT STUDIOS</h1>

        <div class="subtitle">Redes sociales</div>

        <!-- CAMBIÁ LOS LINKS -->
        <a class="link" href="https://www.youtube.com/@RehobotStudios" target="_blank">YOUTUBE</a>
        <a class="link" href="https://www.roblox.com/es/communities/5459675/Rehobot-Studios#!/about" target="_blank">ROBLOX</a>
        <a class="link" href="https://discord.gg/rMXNNGPNRv" target="_blank">DISCORD</a>

        <footer>
            © 2026 • Rehobot Studios
        </footer>
    </div>

</body>
</html>
